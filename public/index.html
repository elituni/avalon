<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#20282c">
    <title>Avalon · Game room</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="/">AVALON <span aria-hidden="true">✦</span></a>
      <span class="room-label">GAME ROOM</span>
      <span id="connection" role="status" data-state="connecting">Connecting…</span>
    </header>
    <main class="room-layout">
      <section class="table-panel panel" aria-labelledby="table-title">
        <div class="panel-heading"><h1 id="table-title">The table</h1><span id="lobby-count" class="badge">0 / 6 online</span></div>
        <form id="join-form" class="join-bar" hidden>
          <label class="sr-only" for="name">Your name</label>
          <input id="name" name="name" maxlength="24" required autocomplete="nickname" placeholder="Your name">
          <button id="join" type="submit" disabled>Join table</button>
        </form>
        <ul id="players" aria-label="Players"></ul>
        <div class="table-actions">
          <p id="hint" class="muted">Connecting…</p>
          <div class="action-buttons">
            <button id="leave" class="secondary" type="button" hidden>Leave</button>
            <button id="start" type="button" hidden disabled>Start game <span aria-hidden="true">→</span></button>
            <button id="reset" class="secondary" type="button" hidden>End game / Reset</button>
          </div>
        </div>
        <p id="feedback" class="error" role="status"></p>
        <section id="role-panel" class="private-panel" hidden aria-label="Your private role">
          <button id="role-toggle" class="role-toggle" type="button" aria-expanded="false" aria-controls="role-content"><span>Your role: <strong id="role">??</strong></span><span id="role-toggle-hint">Show</span></button>
          <div id="role-content" hidden>
          <span id="team" class="badge"></span>
          <h3 id="information-heading"></h3>
          <ul id="information-players" aria-label="Your starting information"></ul>
          <details class="role-help"><summary>Role details</summary><p id="role-description"></p><p id="information-explanation"></p></details>
          </div>
        </section>
      </section>
      <aside class="setup-panel panel" aria-labelledby="setup-title">
        <div class="panel-heading"><h2 id="setup-title">Game setup</h2></div>
        <div class="setup-content">
          <p id="setup-summary" class="muted"></p>
          <div id="setup-roles" class="role-chips" aria-label="Selected roles"></div>
          <details id="setup-editor" hidden>
            <summary>Edit roles</summary>
            <form id="setup-form" hidden>
              <div class="select-row">
                <label for="preset">Preset</label>
                <select id="preset">
                  <option value="">Choose…</option>
                  <option value="5">5 players</option><option value="6">6 players</option>
                  <option value="7">7 players</option><option value="8">8 players</option>
                  <option value="9">9 players</option><option value="10">10 players</option>
                  <option value="15">15 players · custom</option>
                </select>
              </div>
              <div class="select-row"><label for="mode">Mode</label><select id="mode"><option value="standard">Standard</option><option value="custom">Custom</option></select></div>
              <div id="role-inputs"></div>
              <p id="setup-validation" class="muted" role="status"></p>
              <button id="save-setup" type="submit">Save setup</button>
            </form>
          </details>
          <details class="rules-help"><summary>Role guide</summary><dl id="role-guide"></dl><p class="muted">Presets follow standard team sizes. You can choose any mix of roles, up to 15 players.</p></details>
        </div>
      </aside>
      <noscript>Enable JavaScript to join the game.</noscript>
    </main>
  </body>
</html>
